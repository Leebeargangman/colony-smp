name: ColonySMP
version: '${version}'
main: com.colonysmp.ColonySMP
api-version: '1.21'
author: ModdedRealms
description: Communist colonies for SMP servers - claims, citizen AI, a shared State economy, prisoners, forced labour and colony warfare.

commands:
  colony:
    description: The colony command hub
    usage: /colony help
    aliases: [col, commune]

permissions:
  colonysmp.play:
    description: Found, join and run colonies
    default: true
  colonysmp.admin:
    description: Admin commands, claim bypass and item spawning
    default: op
