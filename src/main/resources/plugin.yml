name: ColonySMP
version: '${version}'
main: com.colonysmp.ColonySMP
api-version: '1.21'
author: ModdedRealms
description: Colonies of simulated citizens for SMP servers - territory, buildings, jobs and production chains, an economy, diplomacy and warfare, all simulated even while nobody is there.
softdepend: [Vault]

commands:
  colony:
    description: Everything about colonies
    usage: /colony help
    aliases: [col, colonies]

permissions:
  colonysmp.play:
    description: Create, join and run colonies
    default: true
  colonysmp.admin:
    description: Admin tools, the protection bypass and item spawning
    default: op
